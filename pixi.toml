# Development environment

[workspace]
channels = ["conda-forge"]
name = "StringCompare"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.12.*"
hatch = ">=1.14.1,<2"

[pypi-dependencies]
py-stringcompare = {path=".", editable=true}
ipython = ">=9.5.0, <10"
jupyter = ">=1.1.1, <2"
numpy = "<2"
ruff = ">=0.13.0, <0.14"
pytest = ">=8.4.2, <9"
pybind11 = ">=3.0.1, <4"
jellyfish = ">=1.2.0, <2"
textdistance = ">=4.6.3, <5"
sphinx = ">=8.2.3, <9"
sphinx-rtd-theme = ">=3.0.2, <4"
m2r = ">=0.3.1, <0.4"
myst-parser = ">=4.0.1, <5"
tabulate = ">=0.9.0, <0.10"
py-stringmatching = ">=0.4.6, <0.5"
lxml-html-clean = ">=0.4.2, <0.5"
twine = ">=6.2.0, <7"
build = ">=1.3.0, <2"
