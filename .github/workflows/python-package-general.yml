name: Multi-os tests

on: [push, pull_request, workflow_dispatch]

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, macos-latest]
        python: ["3.7", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python }}
    - name: Install and load
      run: |
        pip install -e .
        python -c "import stringcompare"
    - name: Test with pytest
      run: |
        pip install pytest
        pytest
        
